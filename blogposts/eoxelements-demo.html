<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EOxElements Demo Only</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Open+Sans:400,700&display=swap">
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background: #f8f9fa;
      font-family: 'Open Sans', Arial, sans-serif;
    }
    .demo-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff
    }
    .demo-inner {
      width: 98vw;
      height: 98vh;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      border-radius: 12px;
      background: #fff;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
  </style>
  <!-- EOxElements dependencies -->
  <script type="module" src="https://unpkg.com/@eox/map@latest/dist/eox-map.js"></script>
  <script type="module" src="https://unpkg.com/@eox/map@latest/dist/eox-map-advanced-layers-and-sources.js"></script>
  <script type="module" src="https://unpkg.com/@eox/layercontrol@latest/dist/eox-layercontrol.js"></script>
  <script type="module" src="https://unpkg.com/@eox/jsonform@latest/dist/eox-jsonform.js"></script>
  <script type="module" src="https://unpkg.com/@eox/layout@latest/dist/eox-layout.js"></script>
</head>
<body>
  <div class="demo-container">
    <div class="demo-inner">
      <eox-layout gap="8" style="height: 100%;">
        <eox-layout-item x="0" y="0" w="4" h="12">
          <div class="card fill" style="height: 100%;">
            <div class="padding">
              <eox-layercontrol 
                for="#map"
              ></eox-layercontrol>
            </div>
          </div>
        </eox-layout-item>
        <eox-layout-item x="4" y="0" w="8" h="12">
          <eox-map
            id="map"
            class="fill"
            projection="EPSG:3857"
            style="height: 100%; width: 100%;"
          ></eox-map>
        </eox-layout-item>
      </eox-layout>
    </div>
  </div>
    <script type="module">
      // Layer configuration with embedded schema
      const layers = [
        {
          type: "Tile",
          properties: { 
            id: "basemap",
            title: "OpenStreetMap" 
          },
          source: { 
            type: "XYZ",
            url: "https://tiles.maps.eox.at/wmts/1.0.0/osm_3857/default/g/{z}/{y}/{x}.jpg"
          }
        },
        {
          type: "WebGLTile",
          properties: {
            id: "s2-layer",
            title: "Sentinel-2 GeoZarr",
            layerControlExpand: true,
            layerControlToolsExpand: true,
            layerConfig: {
              type: "style",
              schema: {
                type: "object",
                title: "Visualization Settings",
                properties: {
                  red: {
                    title: "Red Channel",
                    type: "number",
                    enum: [1, 2, 3, 4],
                    options: {
                      enum_titles: ["Red (B04)", "Green (B03)", "Blue (B02)", "SWIR (B11)"]
                    },
                    default: 1
                  },
                  green: {
                    title: "Green Channel",
                    type: "number",
                    enum: [1, 2, 3, 4],
                    options: {
                      enum_titles: ["Red (B04)", "Green (B03)", "Blue (B02)", "SWIR (B11)"]
                    },
                    default: 2
                  },
                  blue: {
                    title: "Blue Channel",
                    type: "number",
                    enum: [1, 2, 3, 4],
                    options: {
                      enum_titles: ["Red (B04)", "Green (B03)", "Blue (B02)", "SWIR (B11)"]
                    },
                    default: 3
                  },
                  redMax: {
                    title: "Red Max Value",
                    type: "number",
                    minimum: 0.1,
                    maximum: 1,
                    default: 0.5,
                    step:0.1,
                    format: "range"
                  },
                  greenMax: {
                    title: "Green Max Value",
                    type: "number",
                    minimum: 0.1,
                    maximum: 1,
                    default: 0.5,
                    step:0.1,
                    format: "range"
                  },
                  blueMax: {
                    title: "Blue Max Value",
                    type: "number",
                    minimum: 0.1,
                    maximum: 1,
                    default: 0.5,
                    step:0.1,
                    format: "range"
                  },
                  gamma: {
                    title: "Gamma Correction",
                    type: "number",
                    minimum: 0.5,
                    maximum: 3.0,
                    default: 1.5,
                    step:0.1,
                    format: "range"
                  }
                }
              },
              legend: {
                title: "Sentinel-2 RGB Composite",
                domain: ["Low", "High"],
                range: ["#000000", "#FFFFFF"]
              }
            }
          },
          source: {
            type: "GeoZarr",
            url: "https://s3.explorer.eopf.copernicus.eu/esa-zarr-sentinel-explorer-fra/tests-output/sentinel-2-l2a/S2B_MSIL2A_20260120T125339_N0511_R138_T27VWL_20260120T131151.zarr/measurements/reflectance",
            bands: ["b04", "b03", "b02", "b11"]
          },
          style: {
            variables: {
              gamma: 1.5,
              red: 1,
              green: 2,
              blue: 3,
              redMax: 0.5,
              greenMax: 0.5,
              blueMax: 0.5
            },
            gamma: ["var", "gamma"],
            color: [
              "array",
              ["/", ["band", ["var", "red"]], ["var", "redMax"]],
              ["/", ["band", ["var", "green"]], ["var", "greenMax"]],
              ["/", ["band", ["var", "blue"]], ["var", "blueMax"]],
              [
                "case",
                ["==", ["+", ["band", ["var", "red"]], ["band", ["var", "green"]], ["band", ["var", "blue"]]], 0],
                0, 
                1
              ]
            ]
          }
        }
      ];
      const eoxMap = document.getElementById('map');
      // Set center and zoom
      eoxMap.center = [-20.12, 63.54];
      eoxMap.zoom = 7;
      Object.assign(eoxMap, { layers });
      // Expand layer control tools after DOM is ready
      window.addEventListener('DOMContentLoaded', () => {
        const layerControl = document.querySelector('eox-layercontrol');
        if (layerControl) {
          layerControl.expanded = true;
          layerControl.toolsExpand = true;
          // Set tools property to only show config
          layerControl.tools = ["config"];
        }
      });
    </script>
</body>
</html>
